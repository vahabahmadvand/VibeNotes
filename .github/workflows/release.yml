name: Release VibeNotes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Prepare Signing Key
        shell: pwsh
        run: |
          $rawKey = @"
          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          "@
          $cleanKey = $rawKey.Trim().Trim('"').Trim("'")
          while ($cleanKey.Length % 4 -ne 0) { $cleanKey += "=" }
          $keyPath = "$env:RUNNER_TEMP\vibenotes.key"
          Set-Content -Path $keyPath -Value $cleanKey -NoNewline
          "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract Release Notes
        id: release_notes
        shell: pwsh
        run: |
          # 1. Attempt to read annotated tag message
          $tagMsg = (git tag -l --format="%(contents)" "${{ github.ref_name }}").Trim()

          if ($tagMsg) {
            $notes = $tagMsg
          } else {
            # 2. Fallback: collect commit messages since previous tag
            $prevTag = git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null
            if ($prevTag) {
              $notes = git log "$prevTag..${{ github.ref_name }}" --pretty=format:"* %s"
            } else {
              $notes = git log -1 --pretty=format:"* %s"
            }
          }

          if (-not $notes) {
            $notes = "Maintenance and performance improvements."
          }

          Write-Host "Resolved Release Notes:"
          Write-Host $notes

          $delimiter = [System.Guid]::NewGuid().ToString()
          "notes<<$delimiter`n$notes`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VibeNotes ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
